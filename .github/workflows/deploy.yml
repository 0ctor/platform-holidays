# CI — platform-holidays
# Push em dev: imagem GHCR + compose no runner octor-dev (homolog VPN :15216).
# Deploy de produção (holidays.octor.com.br) via platform-deploy-hook no push em main.

name: CI — platform-holidays

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-platform-holidays-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Rust (fmt + clippy + test)
    runs-on: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'main') || github.ref == 'refs/heads/main') && fromJSON('["self-hosted","Linux","X64","docker","octor-prd"]') || fromJSON('["self-hosted","Linux","X64","docker","octor-dev"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: cargo fmt / clippy / test (Rust 1.97)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            -e CARGO_TARGET_DIR=/tmp/cargo-target \
            rust:1.97-bookworm \
            bash -c "rustup component add rustfmt clippy && \
              cargo fmt --all --check && \
              cargo clippy --all-targets --all-features -- -D warnings && \
              cargo test --all-features"

  build-and-push:
    name: Build & push GHCR homolog
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: test
    runs-on: [self-hosted, Linux, X64, docker, octor-dev]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (homolog / VPN DEV)
        env:
          TAG: ghcr.io/0ctor/platform-holidays:${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -t "$TAG" -f Dockerfile .
          docker push "$TAG"

  deploy-homolog:
    name: Compose homolog VPN (o-2 / :15216)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, docker, octor-dev]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull + compose up
        env:
          IMAGE: ghcr.io/0ctor/platform-holidays:${{ github.sha }}
          APP_DIR: /home/ubuntu/octor/apps/platform-holidays
        run: |
          set -euo pipefail
          if [[ ! -f "$APP_DIR/docker-compose.yml" ]]; then
            echo "ERRO: docker-compose.yml ausente em $APP_DIR" >&2
            exit 1
          fi
          cd "$APP_DIR"
          if [[ ! -f .env ]]; then
            if [[ -f .env.example ]]; then
              cp .env.example .env
              echo "BOOTSTRAP: .env criado a partir de .env.example"
            else
              echo "ERRO: .env ausente em $APP_DIR" >&2
              exit 1
            fi
          fi
          if grep -q '^IMAGE=' .env; then
            sed -i "s|^IMAGE=.*|IMAGE=${IMAGE}|" .env
          else
            echo "IMAGE=${IMAGE}" >> .env
          fi
          export IMAGE
          docker compose pull
          docker compose up -d
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://127.0.0.1:15216/health/ready" >/dev/null; then
              code="$(curl -sS -o /tmp/holidays-probe.txt -w '%{http_code}' --max-time 5 \
                "http://127.0.0.1:15216/v1/holidays?year=2026&scopes=national" || true)"
              if [[ "$code" == "200" ]]; then
                echo "homolog 127.0.0.1:15216 ok"
                exit 0
              fi
              echo "holidays http $code (aguardando binário novo)"
            fi
            sleep 3
          done
          echo "ERRO: /v1/holidays não respondeu 200 em 127.0.0.1:15216" >&2
          docker compose ps -a >&2 || true
          exit 1
