# Exemplo local / base para apps/platform-holidays no host.
# Produção: sp1-sd-octor-1 · Homolog: sp1-sd-octor-2

name: platform-holidays

services:
  platform-holidays:
    image: ${IMAGE:-ghcr.io/0ctor/platform-holidays:latest}
    container_name: octor-platform-holidays
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:15216:8080"
    networks:
      - octor
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.platform-holidays.loadbalancer.server.port=8080
      - traefik.http.routers.platform-holidays.rule=Host(`holidays.octor.com.br`)
      - traefik.http.routers.platform-holidays.entrypoints=websecure
      - traefik.http.routers.platform-holidays.tls.certresolver=letsencrypt
      - traefik.http.routers.platform-holidays.service=platform-holidays
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  octor:
    external: true
  proxy:
    external: true
