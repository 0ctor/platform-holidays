[package]
name = "platform-holidays"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "API Octor de feriados brasileiros (nacional, estadual, municipal) com datas móveis ano a ano"

[[bin]]
name = "platform-holidays"
path = "src/main.rs"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
